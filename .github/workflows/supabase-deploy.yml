name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.SUPABASE_PROJECT_REF != ''
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Proxy tests
        run: deno test supabase/functions
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy every function
        run: supabase functions deploy --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Smoke check
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/access")
          echo "access without a code: $status"
          test "$status" = 401
