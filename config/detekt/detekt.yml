
config:
  validation: true

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ["Composable"]
  LongMethod:
    ignoreAnnotated: ["Composable", "Test"]
  TooManyFunctions:
    excludes: ["**/test/**", "**/*Test/**"]

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable", "Test"]
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9_]*"

style:
  MagicNumber:
    ignoreAnnotated: ["Preview", "Composable"]
    excludes: ["**/test/**", "**/*Test/**"]
  UnusedPrivateFunction:
    ignoreAnnotated: ["Preview"]
  ForbiddenComment:
    active: false
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true

Compose:
  ComposableAnnotationNaming:
    active: true
  CompositionLocalAllowlist:
    active: true
  ContentEmitterReturningValues:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
